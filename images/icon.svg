<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#b07ce8"/>
      <stop offset="0.7" stop-color="#7a43b8"/>
      <stop offset="1" stop-color="#55288a"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="0.5" stop-color="#c9ced8"/>
      <stop offset="0.51" stop-color="#9aa1ae"/>
      <stop offset="1" stop-color="#7d8492"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d08a1c"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" x2="1">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#4a2a16"/>
    </linearGradient>
    <radialGradient id="poison" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b8ff6a"/>
      <stop offset="0.6" stop-color="#4fd12a"/>
      <stop offset="1" stop-color="#2a8a14"/>
    </radialGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cfe8ff" stop-opacity="0.25"/>
    </radialGradient>
    <clipPath id="flask"><circle cx="128" cy="168" r="31"/></clipPath>
    <g id="dagger" stroke="#21142e" stroke-width="4" stroke-linejoin="round">
      <path d="M0,-88 L15,-56 L12,24 L-12,24 L-15,-56 Z" fill="url(#blade)"/>
      <path d="M0,-74 L0,16" stroke="#8a91a0" stroke-width="2.5" fill="none"/>
      <path d="M3,-52 C14,-52 15,-38 9,-32 C7,-24 13,-18 9,-12 C5,-8 1,-14 3,-20 C4,-28 -2,-34 0,-42 Z"
            fill="#5be02e" stroke="#1d5e0e" stroke-width="2.5"/>
      <rect x="-32" y="22" width="64" height="13" rx="6" fill="url(#gold)"/>
      <rect x="-8" y="35" width="16" height="36" rx="3" fill="url(#grip)"/>
      <path d="M-8,44 L8,48 M-8,53 L8,57 M-8,62 L8,66" stroke="#2e1a0c" stroke-width="2.5"/>
      <circle cx="0" cy="79" r="10" fill="url(#gold)"/>
    </g>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="#2a1640" stroke-width="7"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#c9a2f0" stroke-opacity="0.45" stroke-width="3"/>
  <ellipse cx="128" cy="214" rx="86" ry="20" fill="#3d1c66" opacity="0.55"/>

  <use href="#dagger" transform="translate(128 100) rotate(-38)"/>
  <use href="#dagger" transform="translate(128 100) rotate(38) scale(-1 1)"/>

  <!-- poison flask -->
  <g stroke="#21142e" stroke-width="4" stroke-linejoin="round">
    <rect x="117" y="126" width="22" height="20" rx="3" fill="url(#glass)"/>
    <rect x="112" y="114" width="32" height="14" rx="4" fill="#a8763e"/>
    <circle cx="128" cy="168" r="31" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#flask)">
    <path d="M90,166 C102,158 112,172 126,164 C140,156 150,170 168,162 L168,210 L90,210 Z" fill="url(#poison)"/>
    <circle cx="116" cy="182" r="4" fill="#d8ffb0" opacity="0.8"/>
    <circle cx="136" cy="176" r="3" fill="#d8ffb0" opacity="0.8"/>
    <circle cx="128" cy="192" r="2.5" fill="#d8ffb0" opacity="0.8"/>
  </g>
  <circle cx="128" cy="168" r="31" fill="none" stroke="#21142e" stroke-width="4"/>
  <ellipse cx="116" cy="156" rx="7" ry="11" fill="#ffffff" opacity="0.6" transform="rotate(30 116 156)"/>
  <circle cx="146" cy="104" r="5" fill="#7cf04a" stroke="#1d5e0e" stroke-width="2"/>
  <circle cx="156" cy="90" r="3.5" fill="#7cf04a" stroke="#1d5e0e" stroke-width="2"/>

  <!-- combo points -->
  <g stroke="#21142e" stroke-width="3">
    <rect x="72" y="211" width="18" height="12" rx="3" fill="url(#gold)"/>
    <rect x="95" y="211" width="18" height="12" rx="3" fill="url(#gold)"/>
    <rect x="118" y="211" width="18" height="12" rx="3" fill="url(#gold)"/>
    <rect x="141" y="211" width="18" height="12" rx="3" fill="url(#gold)"/>
    <rect x="164" y="211" width="18" height="12" rx="3" fill="#3a2452"/>
  </g>
</svg>
